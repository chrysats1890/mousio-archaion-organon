<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Contact – Μουσείο Αρχαίων Μουσικών Οργάνων</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-dark text-white py-3">
  <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
    <h1 class="h3 mb-0">Μουσείο Αρχαίων Μουσικών Οργάνων</h1>
    <nav class="mt-3 mt-md-0">
      <a href="index.html" class="nav-link d-inline text-white">Home</a>
      <a href="about.html" class="nav-link d-inline text-white">About</a>
      <a href="contact.html" class="nav-link d-inline text-white">Contact</a>
    </nav>
  </div>
</header>

<main class="container my-4">
  <h2>Επικοινωνία</h2>
  <p>
    Τα παρακάτω στοιχεία είναι ενδεικτικά και χρησιμοποιούνται αποκλειστικά
    για τις ανάγκες της εκπαιδευτικής εργασίας.
  </p>

  <form class="row g-3 mt-2">
    <div class="col-md-6">
      <label for="name" class="form-label">Ονοματεπώνυμο</label>
      <input type="text" class="form-control" id="name" placeholder="Πλήρες όνομα">
    </div>
    <div class="col-md-6">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="name@example.com">
    </div>
    <div class="col-12">
      <label for="message" class="form-label">Μήνυμα</label>
      <textarea class="form-control" id="message" rows="4"
                placeholder="Γράψτε το μήνυμά σας εδώ..."></textarea>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Αποστολή</button>
    </div>
  </form>
</main>

<footer class="bg-dark text-white text-center py-3">
  <small>&copy; 2026 Μουσείο Αρχαίων Μουσικών Οργάνων – Εκπαιδευτική εργασία.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
